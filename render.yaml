# Render.com blueprint: free web service (Docker), one-click: https://render.com/deploy?repo=https://github.com/ridayasir/speedo-live
# Uses the built-in SQLite database, which resets when the free service restarts or wakes from sleep
# (demo routes, buses and accounts are recreated automatically). For data that persists, add a
# DATABASE_URL env var with a free PostgreSQL from neon.tech.
# Free plan note: the web service sleeps after ~15 min idle (first visit then takes ~1 min).
services:
  - type: web
    name: speedo-live
    runtime: docker
    plan: free
    region: singapore          # closest Render region to Pakistan
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true           # redeploys on every push to main
    envVars:
      - key: APP_ENV
        value: production
      - key: SPEEDO_MODE
        value: demo            # simulated buses on the real Speedo routes; switch to "live" once drivers report GPS
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_POSTGIS
        value: "false"
