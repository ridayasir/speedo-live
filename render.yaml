# Render Blueprint: New > Blueprint > pick this repo. The database is your Firebase project (Firestore),
# so only the web service is created. Fill in the FIREBASE_* values when Render asks for them.
# Run ONE instance: the API keeps a live mirror of Firestore data in memory.
services:
  - type: web
    name: speedo-live
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_SOURCE
        value: driver
      - key: CORS_ORIGINS
        value: "*"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
