# Render.com blueprint: free web service (Docker). The database is a free PostgreSQL from neon.tech
# (free forever, no card); Render's own free Postgres expires after 30 days.
# In Render: New -> Blueprint -> pick this repo -> paste the Neon connection string as DATABASE_URL -> Apply.
# Free plan note: the web service sleeps after ~15 min idle (first visit then takes ~1 min).
services:
  - type: web
    name: speedo-live
    runtime: docker
    plan: free
    region: singapore          # closest Render region to Pakistan
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true           # redeploys on every push to main
    envVars:
      - key: APP_ENV
        value: production
      - key: SPEEDO_MODE
        value: demo            # simulated buses on the real Speedo routes; switch to "live" once drivers report GPS
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_POSTGIS
        value: "false"
      - key: DATABASE_URL      # Neon connection string: postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
        sync: false
